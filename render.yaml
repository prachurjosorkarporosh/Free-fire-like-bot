services:
  - type: worker
    name: fast-like-telegram-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    plan: free
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: LIKE_API_URL
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DAILY_BONUS
        value: "5"
      - key: LIKE_COST
        value: "1"
